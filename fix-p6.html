<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
@page{size:297mm 210mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei",sans-serif;background:#0B0D10;color:#F2F4F7}
.page{width:297mm;height:210mm;padding:18mm 20mm;position:relative;display:flex;flex-direction:column}
.kicker{font-size:11pt;letter-spacing:.18em;color:#FF7A2F}
h2{font-size:30pt;line-height:1.25;font-weight:800;margin:4mm 0 3mm;max-width:160mm}
.rule{width:26mm;height:3px;background:#FF7A2F;margin:6mm 0}
.items{margin-top:8mm;display:flex;flex-direction:column;gap:5mm;max-width:160mm}
.item{border-left:3px solid #FF7A2F;padding-left:6mm}
.item b{font-size:13pt}
.item span{display:block;font-size:11pt;color:#98A2B0;margin-top:1.5mm;line-height:1.65}
code{background:#1B2028;padding:1px 5px;border-radius:3px;color:#E8936B;font-size:10pt}
.pnum{position:absolute;right:20mm;top:18mm;font-size:11pt;color:#3A4654;letter-spacing:.2em}
</style></head><body>
<section class="page">
  <div class="pnum">06</div>
  <div class="kicker">状态可见性 · 证据</div>
  <h2>每个页面都能回答那三个问题</h2>
  <div class="rule"></div>
  <div class="items">
    <div class="item"><b>当前状态</b><span>顶栏许可条常驻：<code>露营中｜顶舱 700mm ／ 车高 2.68m｜可降至 200mm（2.18m）</code>
      ——降到底 0 才是 1.98m，界面上分开放，不让人误以为 200mm 就够进地库。</span></div>
    <div class="item"><b>还能做什么</b><span>顶舱页的高度尺把「现在」和「可选目标」画在同一根刻度上，红线索标出地库 2.1m 的物理边界。</span></div>
    <div class="item"><b>出问题怎么办</b><span>离营检查每条阻塞下面直接写解除动作：<code>解除：一键收好（降顶到 0）</code>；未知项显示空心黄圈，不假装通过。</span></div>
  </div>
</section>
</body></html>
